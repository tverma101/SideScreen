name: Codex wireless stabilization

on:
  push:
    branches:
      - codex/sidescreen-s-pen-reconnect-20260904

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: ${{ !contains(github.event.head_commit.message, '[codex-wireless-generated]') }}
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject unauthenticated LAN control clients
        shell: python
        run: |
          from pathlib import Path

          path = Path("MacHost/Sources/StreamingServer.swift")
          text = path.read_text()
          old = '''    private func handleControlConnection(_ newConnection: NWConnection) {
              debugLog("Control connection incoming")
              let requiresAuth = expectedAuthToken != nil && !newConnection.endpoint.isLoopback
              newConnection.stateUpdateHandler = { [weak self, weak newConnection] state in
          '''
          new = '''    private func handleControlConnection(_ newConnection: NWConnection) {
              debugLog("Control connection incoming")
              let isLoopback = newConnection.endpoint.isLoopback
              if !isLoopback && expectedAuthToken == nil {
                  debugLog("Rejecting non-loopback control candidate: wireless mode not active")
                  newConnection.cancel()
                  return
              }
              let requiresAuth = !isLoopback
              newConnection.stateUpdateHandler = { [weak self, weak newConnection] state in
          '''
          if text.count(old) != 1:
              raise SystemExit("StreamingServer control-listener patch anchor changed")
          path.write_text(text.replace(old, new, 1))

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android unit tests
        working-directory: AndroidClient
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: macOS Swift tests
        working-directory: MacHost
        run: swift test

      - name: Commit verified listener hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MacHost/Sources/StreamingServer.swift
          git rm .github/workflows/codex-wireless-stabilize.yml
          git diff --cached --check
          git commit -m "fix(mac): harden wireless control authentication [codex-wireless-generated]"
          git push origin HEAD:codex/sidescreen-s-pen-reconnect-20260904
